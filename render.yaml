services:
  - type: web
    name: aviya-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OLLAMA_MODEL
        value: llama3.2:1b
      - key: OLLAMA_URL
        value: http://localhost:11434
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173
